<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kick Watch</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0b0d;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 64px;
            min-height: 64px;
            background: #111113;
            border-bottom: 1px solid #27272b;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 22px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 20px;
            font-weight: 700;
        }

        .logo-icon {
            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 8px;

            background: #53fc18;
            color: #000;

            font-weight: 900;
            font-size: 16px;
        }

        .logo span {
            color: #53fc18;
        }

        /* =========================
           CONTROLS
        ========================= */

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .username {
            width: 230px;
            height: 38px;

            border: 1px solid #303035;
            border-radius: 7px;

            background: #1a1a1e;
            color: #fff;

            outline: none;

            padding: 0 12px;

            font-size: 14px;
        }

        .username:focus {
            border-color: #53fc18;
        }

        .username::placeholder {
            color: #77777d;
        }

        .watch-button {
            height: 38px;

            border: none;
            border-radius: 7px;

            background: #53fc18;
            color: #000;

            padding: 0 18px;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.15s;
        }

        .watch-button:hover {
            filter: brightness(1.08);
        }

        .watch-button:active {
            transform: scale(0.97);
        }

        /* =========================
           PLAYER
        ========================= */

        main {
            flex: 1;

            min-height: 0;

            display: flex;
            flex-direction: column;
        }

        .player-container {
            flex: 1;

            min-height: 0;

            background: #000;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        iframe {
            width: 100%;
            height: 100%;

            border: 0;

            background: #000;
        }

        /* =========================
           EMPTY SCREEN
        ========================= */

        .empty {
            position: absolute;

            inset: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            background:
                radial-gradient(
                    circle at center,
                    #17171a 0%,
                    #0b0b0d 60%
                );

            pointer-events: none;
        }

        .empty-icon {
            width: 74px;
            height: 74px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #17171a;

            font-size: 30px;

            margin-bottom: 18px;
        }

        .empty h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .empty p {
            color: #8b8b91;
            font-size: 14px;
        }

        /* =========================
           ERROR SCREEN
        ========================= */

        .error-msg {
            position: absolute;

            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);

            background: #2a1414;
            border: 1px solid #55201f;
            color: #ff8a8a;

            padding: 8px 14px;

            border-radius: 7px;

            font-size: 12px;

            display: none;

            z-index: 5;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            height: 42px;
            min-height: 42px;

            background: #111113;
            border-top: 1px solid #27272b;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            color: #77777d;

            font-size: 12px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #53fc18;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 650px) {

            header {
                padding: 0 12px;
            }

            .logo {
                font-size: 16px;
            }

            .logo-icon {
                width: 28px;
                height: 28px;
            }

            .username {
                width: 150px;
            }

            .watch-button {
                padding: 0 12px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        <div class="logo-icon">
            K
        </div>

        Kick <span>Watch</span>
    </div>

    <div class="controls">

        <input
            id="username"
            class="username"
            type="text"
            placeholder="Nome do canal da Kick"
            autocomplete="off"
            spellcheck="false"
        >

        <button
            id="watchButton"
            class="watch-button"
        >
            Assistir
        </button>

    </div>

</header>


<main>

    <div
        id="playerContainer"
        class="player-container"
    >

        <div
            id="empty"
            class="empty"
        >

            <div class="empty-icon">
                ▶
            </div>

            <h2>Assistir uma live</h2>

            <p>
                Digite o nome de um canal da Kick acima.
            </p>

        </div>

        <div
            id="errorMsg"
            class="error-msg"
        >
            Não foi possível carregar a live.
        </div>

    </div>

</main>


<footer>

    <div class="status">

        <div class="status-dot"></div>

        Kick Watch

    </div>

    <div>
        Powered by KICK
    </div>

</footer>


<script>

    const usernameInput =
        document.getElementById("username");

    const watchButton =
        document.getElementById("watchButton");

    const playerContainer =
        document.getElementById("playerContainer");

    const empty =
        document.getElementById("empty");

    const errorMsg =
        document.getElementById("errorMsg");


    /*
     * =========================
     * DETECÇÃO DE AMBIENTE
     * =========================
     *
     * Quando o app roda DENTRO do Discord (como Activity),
     * ele é servido através do proxy do Discord, cujo
     * hostname termina em "discordsays.com".
     *
     * Nesse ambiente, requisições diretas pra domínios
     * externos (como player.kick.com) são bloqueadas pela
     * CSP do Discord (erro "blocked:csp"). É preciso usar
     * um caminho mapeado via "URL Mappings" no Developer
     * Portal, que o proxy do Discord redireciona por baixo
     * dos panos pro domínio real.
     *
     * Fora do Discord (navegador normal, ex: GitHub Pages),
     * não existe esse proxy — então usamos a URL direta da
     * Kick.
     *
     * IMPORTANTE: troque "SEU_PREFIXO_AQUI" pelo prefixo que
     * você configurar em Developer Portal > Activities >
     * URL Mappings apontando para "player.kick.com".
     * Exemplo de mapeamento:
     *   Prefixo:  /kick-player
     *   Destino:  player.kick.com
     */

    const KICK_PLAYER_PROXY_PREFIX = "/kick-player";

    const isRunningInsideDiscord =
        window.location.hostname.endsWith("discordsays.com");


    function buildPlayerUrl(username) {

        if (isRunningInsideDiscord) {

            /*
             * Caminho relativo: o proxy do Discord
             * intercepta e redireciona pro domínio
             * mapeado (player.kick.com).
             */

            return (
                KICK_PLAYER_PROXY_PREFIX +
                "/" +
                encodeURIComponent(username) +
                "?autoplay=true"
            );

        }

        /*
         * Fora do Discord: usa a URL real da Kick
         * diretamente, como no navegador comum.
         */

        return (
            "https://player.kick.com/" +
            encodeURIComponent(username) +
            "?autoplay=true"
        );

    }


    function loadKick(username) {

        username = username
            .trim()
            .toLowerCase();

        /*
         * Remove espaços e caracteres
         * que não fazem sentido em username.
         */

        username = username.replace(
            /[^a-z0-9_]/g,
            ""
        );

        if (!username) {

            usernameInput.focus();

            return;
        }

        errorMsg.style.display = "none";


        /*
         * Cria o player oficial da KICK.
         */

        const iframe =
            document.createElement("iframe");

        iframe.src = buildPlayerUrl(username);

        iframe.allow =
            "autoplay; fullscreen";

        iframe.allowFullscreen = true;

        iframe.setAttribute(
            "frameborder",
            "0"
        );

        iframe.setAttribute(
            "scrolling",
            "no"
        );

        /*
         * Se o iframe não conseguir carregar
         * (ex: mapeamento ausente/errado dentro
         * do Discord), mostra um aviso em vez de
         * ficar com a tela em branco sem feedback.
         */

        let loaded = false;

        iframe.addEventListener("load", () => {
            loaded = true;
        });

        setTimeout(() => {

            if (!loaded) {

                errorMsg.style.display = "block";

            }

        }, 6000);


        /*
         * Remove player anterior.
         */

        const oldIframe =
            playerContainer.querySelector("iframe");

        if (oldIframe) {

            oldIframe.remove();

        }


        /*
         * Esconde tela inicial.
         */

        empty.style.display = "none";


        /*
         * Coloca o novo player.
         */

        playerContainer.appendChild(
            iframe
        );

    }


    watchButton.addEventListener(
        "click",
        () => {

            loadKick(
                usernameInput.value
            );

        }
    );


    usernameInput.addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {

                loadKick(
                    usernameInput.value
                );

            }

        }
    );

</script>

</body>
</html>
